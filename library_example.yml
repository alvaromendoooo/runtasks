version: "1.0"
name: "publish-library-example"

stages:
  - name: check_and_test
    commands:
      - cargo test
      - cargo doc --no-deps

  - name: dry_run
    commands:
      # Probar que el paquete se puede empaquetar sin errores
      - cargo publish --dry-run

  - name: publish
    commands:
      # Publicar oficialmente en el registro
      - cargo publish --token $CARGO_REGISTRY_TOKEN